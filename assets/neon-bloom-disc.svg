<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NEON BLOOM 원형 LP 아트</title><desc id="desc">석양과 네온 꽃, 원근 격자를 원판 전체에 인쇄한 NEON BLOOM LP 아트. 앨범 제목은 원형 인쇄 안전 영역 안에 배치했습니다.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#2a0f3d"/><stop offset=".55" stop-color="#4a1747"/><stop offset="1" stop-color="#160a24"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="200" x2="0" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#ffd67a"/><stop offset=".55" stop-color="#ff8a8f"/><stop offset="1" stop-color="#d34fa6"/></linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9fd2"/><stop offset="1" stop-color="#8d6bff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff79b8" stop-opacity=".25"/><stop offset="1" stop-color="#ff79b8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#ffd8f0" stroke-opacity=".05"/></pattern>
    <linearGradient id="print-fade" x1="0" y1="520" x2="0" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#060b1400"/><stop offset=".6" stop-color="#060b14" stop-opacity=".76"/><stop offset="1" stop-color="#060b14" stop-opacity=".92"/></linearGradient>
  </defs>
  <path fill="url(#bg)" d="M0 0h800v800H0z"/><path fill="url(#grid)" d="M0 0h800v800H0z"/>
  <circle cx="400" cy="340" r="340" fill="url(#halo)"/>
  <circle cx="400" cy="335" r="140" fill="url(#sun)"/>
  <g fill="#2a0f3d"><path d="M250 380h300v10H250zM250 410h300v14H250zM250 442h300v18H250z"/></g>
  <g stroke="#ff9fd2" stroke-opacity=".55" stroke-width="2"><path d="M60 560h680M110 600h580M170 640h460M400 480L60 800M400 480L740 800M400 480L250 800M400 480L550 800"/></g>
