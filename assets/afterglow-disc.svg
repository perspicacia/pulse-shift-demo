  <title id="title">AFTERGLOW 원형 LP 아트</title><desc id="desc">잔광과 라임색 파형을 원판 전체에 인쇄한 AFTERGLOW LP 아트. 앨범 제목은 원형 인쇄 안전 영역 안에 배치했습니다.</desc>
